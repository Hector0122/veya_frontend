# Publica un APK firmado como GitHub Release al hacer push de un tag `v*`
# (p. ej. `git tag v1.1.0 && git push origin v1.1.0`). La app compara su
# versión con la última release y ofrece actualizar (src/services/updates.ts).
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.6.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: pnpm install --frozen-lockfile
      - name: Versión de la app desde el tag
        run: |
          printf "export const APP_VERSION: string | null = '%s';\n" "${GITHUB_REF_NAME#v}" > src/appVersion.ts
      - name: Keystore de release
        run: echo "${{ secrets.VEYA_KEYSTORE_BASE64 }}" | base64 -d > android/app/veya-release.keystore
      - name: Compilar APK
        working-directory: android
        env:
          VEYA_KEYSTORE_PASSWORD: ${{ secrets.VEYA_KEYSTORE_PASSWORD }}
          VEYA_KEY_PASSWORD: ${{ secrets.VEYA_KEY_PASSWORD }}
          VEYA_KEY_ALIAS: ${{ secrets.VEYA_KEY_ALIAS }}
        run: ./gradlew assembleRelease -PversionCode=${{ github.run_number }} -PversionName=${GITHUB_REF_NAME#v}
      - name: Publicar release
        run: |
          mv android/app/build/outputs/apk/release/app-release.apk "veya-${GITHUB_REF_NAME}.apk"
          gh release create "$GITHUB_REF_NAME" "veya-${GITHUB_REF_NAME}.apk" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
